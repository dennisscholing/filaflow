name: Test and publish container

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: filaflow_test
          POSTGRES_USER: filaflow
          POSTGRES_PASSWORD: test-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filaflow -d filaflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: backend
      FILAFLOW_DATABASE_URL: postgresql+psycopg://filaflow:test-database-password@127.0.0.1:5432/filaflow_test
      FILAFLOW_CONFIG_DIR: /tmp/filaflow-config
      FILAFLOW_BOOTSTRAP_ADMIN_EMAIL: admin@test.local
      FILAFLOW_BOOTSTRAP_ADMIN_PASSWORD: test-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: npm ci
      - run: npm run lint
      - run: npm run build:spa
      - run: python -m pip install -r backend/requirements.txt
      - name: Test representative v0.2.0 upgrade
        run: |
          cd backend
          python -m alembic upgrade 0003_printer_location
          cd ..
          python backend/tests/upgrade_fixture.py seed
          cd backend
          python -m alembic upgrade head
          cd ..
          python backend/tests/upgrade_fixture.py verify
      - name: Test v0.5.2 upgrade, repeat, and schema rollback
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://filaflow:test-database-password@127.0.0.1:5432/filaflow_test", autocommit=True) as connection:
              connection.execute("CREATE DATABASE filaflow_v052_test")
          PY
          export FILAFLOW_DATABASE_URL=postgresql+psycopg://filaflow:test-database-password@127.0.0.1:5432/filaflow_v052_test
          cd backend
          python -m alembic upgrade 0006_user_password_security
          cd ..
          python backend/tests/upgrade_fixture.py seed
          cd backend
          python -m alembic upgrade head
          cd ..
          python backend/tests/upgrade_fixture.py verify
          cd backend
          python -m alembic upgrade head
          cd ..
          python backend/tests/upgrade_fixture.py verify
          cd backend
          python -m alembic downgrade 0006_user_password_security
          cd ..
          python backend/tests/upgrade_fixture.py verify-rollback
      - run: python -m pytest backend/tests client/prusa-hook/test_hook.py -q -p no:cacheprovider
      - run: docker compose --env-file .env.example config --quiet

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/filaflow
          tags: |
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  candidate:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the tested commit image to the candidate tag
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/filaflow
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          source="${IMAGE}:sha-${short_sha}"
          docker buildx imagetools inspect "$source"
          docker buildx imagetools create --tag "${IMAGE}:${RELEASE_TAG}" "$source"
          source_digest="$(docker buildx imagetools inspect "$source" --format '{{.Manifest.Digest}}')"
          candidate_digest="$(docker buildx imagetools inspect "${IMAGE}:${RELEASE_TAG}" --format '{{.Manifest.Digest}}')"
          test "$source_digest" = "$candidate_digest"

  promote:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the already-tested image digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/filaflow
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          source="${IMAGE}:sha-${short_sha}"
          docker buildx imagetools inspect "$source"
          docker buildx imagetools create --tag "${IMAGE}:${RELEASE_TAG}" --tag "${IMAGE}:latest" "$source"
          source_digest="$(docker buildx imagetools inspect "$source" --format '{{.Manifest.Digest}}')"
          latest_digest="$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{.Manifest.Digest}}')"
          test "$source_digest" = "$latest_digest"
